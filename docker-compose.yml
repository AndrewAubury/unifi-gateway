version: "3.8"

services:
  unifi-gateway:
    # Local-only tag: this branch's image is built on the host (docker compose
    # up -d --build) and is never pulled from a registry. Publishing your own
    # build later? Change this to your namespace, e.g.
    # ghcr.io/andrewaubury/unifi-gateway:pfsense
    image: unifi-gateway:pfsense
    build: .
    container_name: unifi-gateway
    restart: unless-stopped
    # Remote pfSense mode (platform = pfsense-api) collects everything over the
    # REST API, so plain bridge networking is fine. Only enable host networking
    # when running a LOCAL collector (platform = linux/openwrt/...) that needs
    # to read the host's real interfaces (Linux only).
    # network_mode: host
    volumes:
      - ./conf:/app/conf
      - ./speedtest.json:/app/speedtest.json:ro
    environment:
      - UNIFI_GW_LOG_LEVEL=INFO
      - UNIFI_GW_CONFIG=/app/conf/unifi-gateway.conf
      # - UNIFI_ADOPT_URL=http://your-controller:8080/inform
      # Keep pfSense credentials out of the mounted config file if preferred:
      # - UNIFI_GW_PFSENSE_URL=https://10.0.0.1
      # - UNIFI_GW_PFSENSE_API_KEY=your-pfsense-api-key
