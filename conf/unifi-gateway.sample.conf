[global]
pid_file = unifi-gateway.pid
disable_broadcast = True

[gateway]
is_adopted = False
# Device identity: UCG-Ultra (a supported Cloud Gateway) instead of the
# deprecated USG/UGW3, so UniFi Network can update past 10.6.
# ports: realif = local interface names (or pfSense interface IDs like
# wan/lan/optN when platform = pfsense-api). "speed" optionally forces the
# reported link speed in Mbps (e.g. 2500 for 2.5Gb links the API can't read).
ports = [ { "ifname": "eth0", "name": "WAN", "type": "wan", "realif": "eth0", "speed": 2500 }, { "ifname": "eth1", "name": "LAN", "type": "lan", "realif": "eth1" } ]
lan_ip = 192.168.1.1
lan_mac = 00:00:00:00:00:00
firmware = 4.1.13
device = UCG-Ultra
device_display = Cloud Gateway Ultra
use_aes_gcm = False
# platform = pfsense-api          ; collect stats from a remote pfSense via its REST API
# verify_controller_ssl = False   ; accept a self-signed cert on https:// inform URLs
# hostname = my-gateway
# isp_name = My ISP               ; shown as the WAN ISP in the UniFi portal
# dhcp_lease_file = /tmp/dhcp.leases
# dhcp_lease_format = dnsmasq  ; dnsmasq, isc, or kea
# ping_target = ping.ubnt.com
# speedtest_file = ./speedtest.json
# discovery_platform = UNIFI-GW    ; platform string in discovery broadcasts

[pfsense]
# Remote pfSense REST API (pfSense-pkg-RESTAPI, /api/v2). Used by the
# pfsense-api collector and by the UniFi -> pfSense firewall sync.
# url = https://192.168.1.1
# api_key = YOUR_API_KEY          ; System > REST API > Keys (X-API-Key)
# username = admin                ; alternative to api_key (JWT auto-refresh)
# password = secret
# verify_ssl = False
# sync_firewall = True            ; apply UniFi port-forward/firewall rules to pfSense
# timeout = 30

[provisioned]
